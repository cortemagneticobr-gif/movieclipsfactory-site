<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="MovieClipsFactory">
  <rect width="64" height="64" rx="14" fill="#16161a"/>
  <!-- Três quadros de filme: é o que o programa faz, cortar um filme em
       pedaços verticais. -->
  <rect x="14" y="16" width="10" height="32" rx="2" fill="#e8557c"/>
  <rect x="27" y="16" width="10" height="32" rx="2" fill="#e8557c" opacity=".65"/>
  <rect x="40" y="16" width="10" height="32" rx="2" fill="#e8557c" opacity=".35"/>
</svg>

